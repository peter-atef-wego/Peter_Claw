name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          # Placeholders such as "..." or "***" are fine; real credentials are not.
          if grep -rInE \
              'xox[bapse]-[A-Za-z0-9-]{20,}|github_pat_[A-Za-z0-9_]{30,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|sk-ant-[A-Za-z0-9-]{20,}|ATATT[A-Za-z0-9_=-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::A credential-shaped string is committed. Move it to .env and read it from the environment."
            exit 1
          fi
          echo "OK: no credential-shaped strings found"

      - name: Every skill has valid SKILL.md frontmatter
        run: |
          fail=0
          for d in skills/*/; do
            f="${d}SKILL.md"
            if [ ! -f "$f" ]; then
              echo "::error file=$d::missing SKILL.md"; fail=1; continue
            fi
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::no frontmatter"; fail=1; }
            grep -qE '^name:' "$f" || { echo "::error file=$f::frontmatter missing name"; fail=1; }
            grep -qE '^description:' "$f" || { echo "::error file=$f::frontmatter missing description"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "OK: all skills have name + description"
          exit $fail

      - name: Example scripts parse
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
          echo "OK: shell examples parse"
